<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎒 초등 과목별 챌린지 🎒</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F0F8FF; /* 배경색을 시원한 하늘색 톤으로 변경 */
            font-family: 'Jua', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(70, 130, 180, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 4px solid #87CEFA;
        }

        h1 {
            color: #1E90FF;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(135, 206, 235, 0.5);
        }

        /* 인트로 및 선택 화면 전용 스타일 */
        #intro-screen h1, #grade-screen h1, #subject-screen h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        #intro-screen p, #grade-screen p, #subject-screen p {
            font-size: 18px;
            color: #4682B4;
            margin-bottom: 30px;
        }
        
        .start-btn {
            font-family: 'Jua', sans-serif;
            background: #1E90FF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(30, 144, 255, 0.4);
            margin-top: 10px;
        }
        .start-btn:hover {
            background: #0000CD;
            transform: translateY(-2px);
        }

        /* 선택 버튼 스타일 (학년 및 과목) */
        .diff-options {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2열로 배치하여 깔끔하게 보이도록 수정 */
            gap: 12px;
            margin-bottom: 20px;
        }
        /* 과목 버튼 등이 홀수일 때 전체 너비 사용 */
        .full-width {
            grid-column: 1 / -1;
        }
        
        .diff-btn {
            font-family: 'Jua', sans-serif;
            background: #f8f8f8;
            color: #333;
            border: 3px solid #87CEFA;
            padding: 15px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn:hover {
            background: #E0FFFF;
            border-color: #1E90FF;
            transform: translateY(-2px);
        }

        /* 메인 게임 화면 및 선택 화면들 (초기 숨김) */
        #grade-screen, #subject-screen, #app {
            display: none; 
        }

        .level-info {
            background: #E0FFFF;
            color: #0000CD;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .progress {
            font-size: 14px;
            color: #1E90FF;
            margin-bottom: 10px;
        }
        .question-box {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 15px;
            border: 2px dashed #87CEFA;
        }
        .question-text {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        /* 선택지 버튼 스타일 (파란 바탕 + 흰색 글씨) */
        button.option-btn {
            font-family: 'Jua', sans-serif;
            background: #1E90FF; 
            color: white;        
            font-weight: bold;
            border: 2px solid #1E90FF; 
            padding: 15px;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(30, 144, 255, 0.4);
        }
        
        button.option-btn:hover {
            background: #0000CD; 
            border: 2px solid #0000CD;
            transform: translateY(-2px);
        }
        button.option-btn:active {
            transform: translateY(1px);
        }
        
        #message {
            margin-top: 20px;
            font-size: 16px;
            color: #1E90FF;
            height: 60px; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="intro-screen" class="card">
    <h1>🎒 초등 만점 챌린지</h1>
    <p>학교 공부 마스터를 향한<br>신나는 여정을 떠나볼까요?</p>
    <button class="start-btn" onclick="goToGradeSelection()">신나게 시작해 보자 확인!</button>
</div>

<div id="grade-screen" class="card">
    <h1>🌱 학년 선택</h1>
    <p>나의 학년을 골라주세요!</p>
    <div class="diff-options">
        <button class="diff-btn" onclick="selectGrade(1)">1학년</button>
        <button class="diff-btn" onclick="selectGrade(2)">2학년</button>
        <button class="diff-btn" onclick="selectGrade(3)">3학년</button>
        <button class="diff-btn" onclick="selectGrade(4)">4학년</button>
        <button class="diff-btn" onclick="selectGrade(5)">5학년</button>
        <button class="diff-btn" onclick="selectGrade(6)">6학년</button>
    </div>
</div>

<div id="subject-screen" class="card">
    <h1>📚 과목 선택</h1>
    <p>도전할 과목을 골라주세요!</p>
    <div class="diff-options">
        <button class="diff-btn" onclick="startGame('국어')">📖 국어</button>
        <button class="diff-btn" onclick="startGame('수학')">📐 수학</button>
        <button class="diff-btn" onclick="startGame('사회')">🌍 사회</button>
        <button class="diff-btn" onclick="startGame('과학')">🔬 과학</button>
        <button class="diff-btn full-width" onclick="startGame('영어')">🔤 영어</button>
    </div>
</div>

<div id="app" class="card">
    <h1>🎒 초등 만점 챌린지 🎒</h1>
    <div class="level-info" id="level-display">Level 1</div>
    <div class="progress" id="progress-display">현재 레벨 진행도: 0 / 1</div>
    
    <div class="question-box">
        <div class="question-text" id="question-text">문제 내용이 여기에 표시됩니다.</div>
    </div>

    <div class="options" id="options-container"></div>

    <div id="message"></div>
</div>

<script>
    /* =======================================================
       🔊 효과음 (Web Audio API) 설정 
       ======================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, startTime) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + startTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + startTime + duration);
        osc.stop(audioCtx.currentTime + startTime + duration);
    }

    function playDingDong() {
        initAudio();
        playTone(659.25, 'sine', 0.5, 0);       // 미(E5)
        playTone(523.25, 'sine', 0.5, 0.4);     // 도(C5)
    }

    function playBeepBeep() {
        initAudio();
        playTone(300, 'square', 0.2, 0);        
        playTone(300, 'square', 0.2, 0.3);      
    }

    window.onload = () => {
        document.body.addEventListener('click', initAudio, { once: true });
        try { playDingDong(); } catch(e) {} 
    };

    /* =======================================================
       🚀 퀴즈 데이터베이스 (학년, 과목, 문제, 보기 4개, 정답)
       - 전 학년, 전 과목 실제 초등 문제 업데이트 완료!
       ======================================================= */

        // --- 전학년 ---

        { grade: 6, subject: "과학", question: "가운데 부분이 가장자리보다 두꺼워 물체를 확대해서 보여주는 렌즈는?", options: ["오목렌즈", "볼록렌즈", "평면거울", "볼록거울"], answer: "볼록렌즈" },

        { grade: 6, subject: "과학", question: "고무, 플라스틱, 유리처럼 전기가 잘 흐르지 않는 물질을 무엇이라고 하나요?", options: ["도체", "부도체", "전지", "스위치"], answer: "부도체" },

      { grade: 4, subject: "과학", question: "보온병이나 아이스박스처럼 외부의 열이 안으로 들어오거나 안의 열이 바깥으로 빠져나가지 못하게 차단하는 성질을 무엇이라고 하나요?", options: ["단열", "전도", "대류", "반사"], answer: "단열" },

      { grade: 4, subject: "과학", question: "빛이 곧게 나아가다가 평평한 거울 표면에 부딪혀서 진행 방향을 바꾸어 튕겨 나가는 성질을 무엇이라고 하나요?", options: ["빛의 직진", "빛의 반사", "빛의 굴절", "빛의 흡수"], answer: "빛의 반사" },
      { grade: 4, subject: "과학", question: "빛이 나아가다가 성질이 다른 물질을 만나 꺾이는 '빛의 굴절' 현상 때문에 일어나는 실생활의 예로 알맞은 것은 무엇인가요?", options: ["물속에 잠긴 사람의 다리가 실제보다 짧고 굵어 보인다", "거울을 보면 내 얼굴이 똑같이 비쳐 보인다", "어두운 방에서 랜턴을 켜면 빛이 똑바로 나아간다", "달의 표면에 있는 크레이터가 선명하게 보인다"], answer: "물속에 잠긴 사람의 다리가 실제보다 짧고 굵어 보인다" },

      { grade: 4, subject: "과학", question: "사막과 같이 물이 매우 부족하고 건조한 기후 환경에서 살아남기 위한 식물의 특징으로 알맞지 않은 것은 무엇인가요?", options: ["잎이 넓고 무성하여 물을 많이 공기 중으로 내보낸다", "줄기나 잎에 물을 가득 저장할 수 있는 저수 조직이 발달했다", "뿌리가 땅속 깊이 자라거나 넓게 퍼져 물을 찾는다", "잎이 가시 모양으로 변해 물이 증발하는 것을 막는다"], answer: "잎이 넓고 무성하여 물을 많이 공기 중으로 내보낸다" },

      { grade: 4, subject: "과학", question: "소금과 모래가 섞인 혼합물을 분리하기 위한 순서로 가장 알맞은 것은?", options: ["자석으로 붙이기 -> 체로 치기", "물에 녹이기 -> 거름종이로 모래 거르기 -> 소금물 증발시키기", "물에 띄우기 -> 손으로 골라내기", "가열하여 녹이기 -> 체로 치기"], answer: "물에 녹이기 -> 거름종이로 모래 거르기 -> 소금물 증발시키기" },

      { grade: 4, subject: "과학", question: "소리가 나는 물체(소리굽쇠나 북 등)를 연주할 때, 우리 눈으로 보거나 손으로 만져서 공통적으로 느낄 수 있는 물리적 현상은 무엇인가요?", options: ["물체의 떨림(진동)", "물체의 온도 상승", "물체의 무게 감소", "물체의 색깔 변화"], answer: "물체의 떨림(진동)" },

      { grade: 4, subject: "과학", question: "손전등의 빛을 물체에 비추어 그림자를 만들었습니다. 이때 그림자의 모양은 물체의 어떤 면의 모양과 항상 같을까요?", options: ["물체의 빛을 받는 면의 모양", "물체의 무게와 부피", "물체의 보이지 않는 뒷면 모양", "물체의 실제 색상"], answer: "물체의 빛을 받는 면의 모양" },
      { grade: 4, subject: "과학", question: "식물 속에 있던 물이 잎에 있는 눈에 보이지 않는 구멍(기공)을 통해 수증기 상태로 공기 중으로 나가는 현상을 무엇이라고 하나요?", options: ["광합성", "호흡 작용", "증산 작용", "흡수 작용"], answer: "증산 작용" },
      { grade: 4, subject: "과학", question: "식물의 꽃이 식물의 한살이 과정에서 하는 가장 중요한 역할은 무엇인가요?", options: ["곤충이나 바람의 도움을 받아 씨앗을 만들어 번식한다", "줄기를 단단하게 지탱한다", "흙 속의 물을 흡수한다", "햇빛을 받아 양분을 만든다"], answer: "곤충이나 바람의 도움을 받아 씨앗을 만들어 번식한다" },

      { grade: 4, subject: "과학", question: "식물의 한살이 관찰 시, 싹이 터서 자라다가 꽃을 피우고 열매를 맺은 뒤 한 해 안에 일생을 마치는 식물은?", options: ["개나리", "강낭콩", "소나무", "사과나무"], answer: "강낭콩" },
      { grade: 4, subject: "과학", question: "식물의 한살이를 관찰하고 기록할 때 연구자로서 가져야 할 가장 올바른 태도는 무엇인가요?", options: ["식물의 변화 과정을 주기적으로 관찰하여 사실대로 기록한다", "귀찮으면 며칠 상상해서 한 번에 적는다", "글씨만 예쁘게 쓰고 관찰 그림은 생략한다", "내가 원하는 가상의 모습으로 자라도록 기록한다"], answer: "식물의 변화 과정을 주기적으로 관찰하여 사실대로 기록한다" },
      { grade: 4, subject: "과학", question: "아주 옛날에 살던 생물의 유해가 지층 속에 파묻힌 후 오랫동안 열과 압력을 받아 변하여, 오늘날 우리가 에너지를 얻는 데 쓰는 석탄, 석유 등을 무엇이라고 하나요?", options: ["화석 연료", "퇴적암", "보석", "용암"], answer: "화석 연료" },

      { grade: 4, subject: "과학", question: "양팔저울로 두 물체의 무게를 직접 비교하여 수평을 잡으려고 합니다. 무게가 똑같은 두 물체로 수평을 이루려면 받침점으로부터 어디에 놓아야 할까요?", options: ["받침점으로부터 서로 같은 거리에 놓는다", "한쪽 물체를 훨씬 멀리 놓는다", "한쪽 물체를 받침점 바로 위에 놓는다", "거리에 상관없이 아무 데나 놓는다"], answer: "받침점으로부터 서로 같은 거리에 놓는다" },

      { grade: 4, subject: "과학", question: "열의 이동을 막는 단열 원리 중, 보온병 내부의 벽면을 은색으로 반짝이게 도금하여 열이 빛의 형태로 빠져나가는 것을 막는 열 이동 방식은 무엇인가요?", options: ["복사", "전도", "대류", "굴절"], answer: "복사" },

      { grade: 5, subject: "과학", question: "물에 소금을 녹일 때, 더 많은 양의 소금을 녹이려면 어떻게 해야 할까요?", options: ["물의 양을 줄인다.", "물의 온도를 낮춘다.", "물의 온도를 높인다.", "얼음을 넣는다."], answer: "물의 온도를 높인다." },
      { grade: 5, subject: "과학", question: "물이 끓어서 수증기로 상태가 변하는 현상을 무엇이라고 하나요?", options: ["응결", "기화(증발)", "융해", "응고"], answer: "기화(증발)" },
      { grade: 5, subject: "과학", question: "물이 담긴 컵에 빨대를 투명하게 꽂아 비스듬히 바라보았을 때, 빨대가 물과 공기의 경계면에서 꺾여 보이는 현상은 빛의 어떤 성질 때문입니까?", options: ["빛의 직진", "빛의 반사", "빛의 굴절", "빛의 합성"], answer: "빛의 굴절" },
      { grade: 5, subject: "과학", question: "물이 얼어서 얼음이 될 때, 물의 무게와 부피의 변화로 알맞은 것은?", options: ["무게는 늘어나고 부피는 줄어든다.", "무게는 줄어들고 부피는 늘어난다.", "무게는 변함없고 부피는 늘어난다.", "무게와 부피 모두 줄어든다."], answer: "무게는 변함없고 부피는 늘어난다." },
      { grade: 5, subject: "과학", question: "물이나 공기 같은 액체나 기체에서, 데워진 물질이 위로 올라가고 찬 물질이 아래로 내려오며 열이 이동하는 방법은?", options: ["전도", "대류", "복사", "굴절"], answer: "대류" },
      { grade: 5, subject: "과학", question: "물체의 이동 거리(m)를 걸린 시간(s)으로 나누어 구하는, 물체의 빠르기를 나타내는 올바른 계산 공식은 무엇입니까?", options: ["이동 거리 ÷ 걸린 시간", "이동 거리 × 걸린 시간", "걸린 시간 ÷ 이동 거리", "이동 거리 + 걸린 시간"], answer: "이동 거리 ÷ 걸린 시간" },
      { grade: 5, subject: "과학", question: "물체의 이동 거리와 걸린 시간을 이용하여 빠르기를 나타내는 '속력'의 단위 중, 1시간 동안 이동한 킬로미터(km) 거리를 뜻하는 단위 표기는 무엇입니까?", options: ["m/s", "km/h", "g/cm³", "kg"], answer: "km/h" },
      { grade: 5, subject: "과학", question: "바다의 잠수함에서 물 밖의 모습을 보기 위해 사용하는 '잠망경'은 어떤 거울의 원리를 이용한 것입니까?", options: ["오목거울", "볼록거울", "평면거울", "볼록렌즈"], answer: "평면거울" },
      { grade: 5, subject: "과학", question: "밤사이에 기온이 내려가면서 공기 중의 수증기가 물방울로 변해 풀잎이나 나뭇잎 표면에 맺히는 자연 현상을 무엇이라고 합니까?", options: ["이슬", "서리", "안개", "얼음"], answer: "이슬" },
      { grade: 5, subject: "과학", question: "밤하늘에서 항상 북쪽을 가리켜 방향을 찾을 때 기준이 되는 별은?", options: ["북극성", "금성", "시리우스", "오리온"], answer: "북극성" },
      { grade: 5, subject: "과학", question: "밤하늘을 관찰할 때 스스로 빛을 내는 별(항성)과 달리, 행성이 가지는 가장 뚜렷한 특징은 무엇입니까?", options: ["항상 같은 자리에 멈추어 있다.", "며칠 동안 관찰하면 별자리 사이에서 위치가 변한다.", "달보다 모양 변화가 훨씬 빠르다.", "남쪽 하늘에서만 관찰할 수 있다."], answer: "며칠 동안 관찰하면 별자리 사이에서 위치가 변한다." },
      { grade: 5, subject: "과학", question: "방바닥을 보일러로 데우면 따뜻해진 공기가 위로 올라가고 찬 공기가 아래로 내려오면서 방 전체가 따뜻해집니다. 이와 같은 열의 이동 방식을 무엇이라고 합니까?", options: ["전도", "대류", "복사", "단열"], answer: "대류" },

      { grade: 5, subject: "과학", question: "버섯과 곰팡이는 식물과 달리 스스로 광합성을 하지 못합니다. 이 생물 무리(균류)가 번식하기 위해 멀리 퍼뜨리는 미세한 세포 알갱이를 무엇이라고 합니까?", options: ["씨앗", "포자(홀씨)", "꽃가루", "열매"], answer: "포자(홀씨)" },

      { grade: 5, subject: "과학", question: "보온병이나 건물 벽면에 스티로폼을 넣는 것처럼, 물질과 물질 사이의 열의 이동을 차단하거나 늦추는 전 과정을 무엇이라고 합니까?", options: ["전도", "대류", "복사", "단열"], answer: "단열" },
      { grade: 5, subject: "과학", question: "보온병이나 아이스박스처럼 열의 이동을 막아서 물체의 온도를 일정하게 유지하는 전 과정을 무엇이라고 합니까?", options: ["전도", "대류", "복사", "단열"], answer: "단열" },

      { grade: 5, subject: "과학", question: "비 온 뒤 축축했던 땅이 마르거나, 젖은 빨래가 마르는 현상과 가장 관련 깊은 것은?", options: ["응결", "융해", "증발", "응고"], answer: "증발" },

      { grade: 5, subject: "과학", question: "빛을 한 곳으로 모아주는 성질이 있어 손전등 내부나 치과용 거울, 화장용 거울처럼 가까운 물체를 크게 보여주는 데 사용하는 거울은 무엇입니까?", options: ["평면 거울", "볼록 거울", "오목 거울", "다면 거울"], answer: "오목 거울" },

      { grade: 5, subject: "과학", question: "빛이 공기 중에서 똑바로 나아가는 '빛의 직진' 성질 때문에 우리 주변에서 나타나는 대표적인 자연 현상은 무엇입니까?", options: ["불투명한 물체 뒤편에 빛이 통과하지 못해 '그림자'가 생긴다.", "물속에 넣은 빨대가 꺾여 보인다.", "거울을 보면 내 얼굴의 좌우가 바뀌어 보인다.", "비 온 뒤 하늘에 아름다운 무지개가 뜬다."], answer: "불투명한 물체 뒤편에 빛이 통과하지 못해 '그림자'가 생긴다." },
      { grade: 5, subject: "과학", question: "빛이 직진하다가 공기와 유리처럼 성질이 서로 다른 물질의 경계면을 지나갈 때 진행 방향이 꺾이는 현상을 무엇이라고 합니까?", options: ["빛의 직진", "빛의 반사", "빛의 굴절", "빛의 흡수"], answer: "빛의 굴절" },
      { grade: 5, subject: "과학", question: "사이다나 콜라 같은 시원한 탄산음료 속에 톡 쏘는 청량한 맛을 내며 액체 속에 완전히 녹아 들어가 있는 '기체 상태의 용질' 이름은 무엇입니까?", options: ["산소", "이산화탄소", "질소", "수소"], answer: "이산화탄소" },
      { grade: 5, subject: "과학", question: "산성 용액과 염기성 용액을 서로 알맞은 양으로 섞었을 때, 각 용액이 원래 가지고 있던 성질이 약해지거나 사라지는 현상을 무엇이라고 합니까?", options: ["중화 현상", "용해 현상", "기화 현상", "앙금 생성 현상"], answer: "중화 현상" },

      { grade: 5, subject: "국어", question: "문장 성분 중 서술어가 나타내는 움직임이나 상태의 주체가 되는 성분(누가/무엇이)을 무엇이라고 합니까?", options: ["주어", "목적어", "보어", "부속어"], answer: "주어" },
      { grade: 5, subject: "국어", question: "문장 성분 중 주어의 움직임, 상태, 성질 등을 자세하게 풀이하여 설명하는 문장 성분은 무엇입니까?", options: ["주어", "서술어", "목적어", "보어"], answer: "서술어" },

      { grade: 5, subject: "국어", question: "문장 성분 중에서 서술어의 행위나 동작의 대상이 되며, 주로 '~을/를'이 붙는 성분은 무엇입니까?", options: ["주어", "목적어", "보어", "관형어"], answer: "목적어" },
      { grade: 5, subject: "국어", question: "문장 성분 중에서 주로 동사나 형용사 앞에 붙어 '어떻게', '어디서' 등을 나타내며 뜻을 더 자세하게 꾸며주는 역할을 하는 성분은 무엇입니까?", options: ["주어", "목적어", "부사어", "관형어"], answer: "부사어" },
      { grade: 5, subject: "국어", question: "문장 속에서 인물의 마음속으로 한 생각을 적을 때 사용하는 올바른 문장 부호는 무엇입니까?", options: ["작은따옴표('')", "큰따옴표(\"\")", "쉼표(,)", "느낌표(!)"], answer: "작은따옴표('')" },
      { grade: 5, subject: "국어", question: "문장 안에서 어떤 말 뒤에 그에 대한 구체적인 설명을 덧붙이거나 종류를 열거할 때 사용하는 문장 부호(:)의 이름은 무엇입니까?", options: ["쉼표", "쌍점", "쌍반점", "빗금"], answer: "쌍점" },
      { grade: 5, subject: "국어", question: "문장에서 '누가' 또는 '무엇이'에 해당하는 문장 성분은 무엇입니까?", options: ["주어", "서술어", "목적어", "보어"], answer: "주어" },
      { grade: 5, subject: "국어", question: "문장에서 '누가/무엇이'에 대하여 '어찌하다', '어떠하다', '무엇이다'라고 설명하는 문장 성분은 무엇입니까?", options: ["주어", "서술어", "목적어", "관형어"], answer: "서술어" },
      { grade: 5, subject: "국어", question: "문장에서 다른 말을 꾸며 주는 역할을 하는 낱말이 쓰인 것은?", options: ["하늘이 푸르다.", "새 신발을 샀다.", "나는 학생이다.", "밥을 먹는다."], answer: "새 신발을 샀다." },
      { grade: 5, subject: "국어", question: "'발 없는 말이 천 리 간다'는 속담의 뜻으로 알맞은 것은?", options: ["발이 빠른 말이 멀리 간다.", "소문은 순식간에 멀리 퍼지므로 말조심을 해야 한다.", "말(동물)을 잘 타야 먼 길을 갈 수 있다.", "말을 많이 하면 실수를 하게 된다."], answer: "소문은 순식간에 멀리 퍼지므로 말조심을 해야 한다." },
      { grade: 5, subject: "국어", question: "발표를 할 때 수량의 변화나 비율 등을 한눈에 알아보기 쉽게 나타내는 시각 자료는 무엇입니까?", options: ["도표나 그래프", "긴 줄글", "오디오 파일", "사전"], answer: "도표나 그래프" },
      { grade: 5, subject: "국어", question: "상대방에게 질문을 던져 어떠한 사실에 대한 대답을 요구하는 문장의 종류를 무엇이라고 합니까?", options: ["의문문", "평서문", "명령문", "청유문"], answer: "의문문" },
      { grade: 5, subject: "국어", question: "상대방에게 행동을 요구하거나 지시하는 문장을 끝낼 때 가장 알맞은 문장 부호는?", options: ["물음표(?)", "마침표(.)", "쉼표(,)", "줄임표(……)"], answer: "마침표(.)" },
      { grade: 5, subject: "국어", question: "상대방의 마음을 헤아리며 대화할 때, 슬퍼하는 친구에게 건넬 공감의 표현으로 가장 알맞은 것은 무엇입니까?", options: ["그게 왜 슬픈 일이니?", "속상했겠다, 네 마음이 충분히 이해가 돼.", "앞으로는 울지 마.", "별일 아니니까 그냥 잊어버려."], answer: "속상했겠다, 네 마음이 충분히 이해가 돼." },
      { grade: 5, subject: "국어", question: "상대방의 의견을 존중하며 함께 문제를 해결하기 위해 의견을 나누는 말하기 방식은?", options: ["토의", "연설", "광고", "설명"], answer: "토의" },
      { grade: 5, subject: "국어", question: "상대방의 이야기를 듣고 '그러니까 네 말은 숙제가 너무 많아서 힘들다는 뜻이지?'라고 상대방의 마음을 요약하며 공감해 주는 올바른 경청 방법은 무엇입니까?", options: ["소극적 경청", "적극적 경청", "비판적 경청", "형식적 경청"], answer: "적극적 경청" },
      { grade: 5, subject: "국어", question: "상대방의 이야기를 들을 때 올바른 경청의 자세로 알맞지 않은 것은?", options: ["상대방의 눈을 바라보며 듣는다.", "고개를 끄덕이거나 맞장구를 친다.", "딴청을 피우거나 중간에 말을 자른다.", "상대방의 마음을 공감하며 듣는다."], answer: "딴청을 피우거나 중간에 말을 자른다." },
      { grade: 5, subject: "국어", question: "설명문에서 낱말이나 대상의 뜻을 명확하게 풀이하여 설명하는 방법을 무엇이라고 합니까?", options: ["정의", "예시", "비교", "분류"], answer: "정의" },
      { grade: 5, subject: "국어", question: "설명문에서 독자의 이해를 돕기 위해 구체적인 알맞은 실례를 들어 설명하는 방법은 무엇입니까?", options: ["비교", "대조", "예시", "분류"], answer: "예시" },
      { grade: 5, subject: "국어", question: "설명문에서 두 가지 이상의 대상에 대해 '서로 다른 점'을 중심으로 설명하는 방법을 무엇이라고 합니까?", options: ["대조", "비교", "분류", "예시"], answer: "대조" },
      { grade: 5, subject: "국어", question: "설명문에서 두 가지 이상의 대상에 대해 서술할 때, 대상들이 가진 '공통점'을 중심으로 설명하는 방법을 무엇이라고 합니까?", options: ["비교", "대조", "분류", "정의"], answer: "비교" },
      { grade: 5, subject: "국어", question: "설명문에서 여러 가지 대상을 일정한 기준에 따라 묶어서 설명하는 방법은 무엇입니까?", options: ["비교", "대조", "분류", "정의"], answer: "분류" },

      { grade: 5, subject: "국어", question: "설명문의 짜임 중에서 '설명하려는 대상을 처음으로 소개하고, 글을 쓰게 된 목적이나 동기를 밝히는 부분'은 어디입니까?", options: ["머리말(서론)", "본문", "맺음말(결론)", "제목"], answer: "머리말(서론)" },
      { grade: 5, subject: "국어", question: "설명문이나 논설문에서 글을 쓸 때 문단을 나누는(문단 나누기) 가장 중요한 올바른 원칙은 무엇입니까?", options: ["한 문단에는 반드시 하나의 중심 생각만 담아야 한다.", "문단의 길이는 무조건 길게 늘여 쓸수록 좋다.", "한 문단 안에 여러 개의 주장을 자유롭게 섞어 써야 한다.", "문단을 나눌 때는 문장의 첫 칸을 띄어 쓰지 않는다."], answer: "한 문단에는 반드시 하나의 중심 생각만 담아야 한다." },
      { grade: 5, subject: "국어", question: "시에서 운율(말의 가락)을 느끼게 하는 방법 중 하나로 가장 알맞은 것은 무엇입니까?", options: ["어려운 한자어를 많이 사용한다.", "같거나 비슷한 말이나 문장을 반복한다.", "문장의 길이를 최대한 길게 늘인다.", "그림이나 사진 자료를 시 속에 넣는다."], answer: "같거나 비슷한 말이나 문장을 반복한다." },

      { grade: 5, subject: "국어", question: "실제 있었던 인물의 삶을 사실에 바탕을 두고 쓴 글은 무엇입니까?", options: ["동화", "전기문", "설명문", "기행문"], answer: "전기문" },
      { grade: 5, subject: "국어", question: "실존했던 인물의 일생과 업적을 사실에 바탕을 두고 기록한 글의 종류를 무엇이라고 합니까?", options: ["설명문", "전기문", "논설문", "기행문"], answer: "전기문" },
      { grade: 5, subject: "국어", question: "어떤 사실이나 지식을 독자가 알기 쉽게 객관적인 사실 바탕으로 쓴 글의 종류는 무엇입니까?", options: ["논설문", "설명문", "기행문", "동화"], answer: "설명문" },
      { grade: 5, subject: "국어", question: "어떤 일을 하려고 하는데 뜻하지 않게 마침 일이 잘 들어맞거나 공교로운 상황이 생김을 뜻하는 속담은 무엇입니까?", options: ["가는 날이 장날이다", "하늘의 별 따기", "금강산도 식후경", "누워서 떡 먹기"], answer: "가는 날이 장날이다" },
      { grade: 5, subject: "국어", question: "어떤 주제에 대하여 찬성하는 편과 반대하는 편으로 나뉘어 자신의 주장이 옳음을 내세우는 말하기 방식은?", options: ["토의", "토론", "수다", "인터뷰"], answer: "토론" },

      { grade: 5, subject: "국어", question: "온라인 대화(채팅)를 할 때 지켜야 할 예절로 올바른 것은?", options: ["내가 하고 싶은 말만 계속한다.", "상대방의 얼굴이 보이지 않으므로 험담을 해도 된다.", "정확한 표준어 대신 줄임말만 사용한다.", "상대방의 입장을 생각하며 존중하는 말을 쓴다."], answer: "상대방의 입장을 생각하며 존중하는 말을 쓴다." },
      { grade: 5, subject: "국어", question: "'우리 학교 운동장에 천연잔디를 깔아야 한다'라는 주장에 대하여 타당하고 적절한 근거로 보기 어려운 것은 무엇입니까?", options: ["학생들이 넘어졌을 때 부상을 입을 위험이 줄어든다.", "초록색 잔디가 학생들의 시각적 피로를 덜어줄 수 있다.", "잔디를 푸르게 관리하는 데 매년 많은 비용과 노력이 든다.", "운동장에서 먼지가 날리는 것을 막아 주어 공기가 좋아진다."], answer: "잔디를 푸르게 관리하는 데 매년 많은 비용과 노력이 든다." },
      { grade: 5, subject: "국어", question: "우리말 중에서 한자를 바탕으로 만들어진 말로, 우리말 어휘의 가장 많은 부분을 차지하는 말의 종류는 무엇입니까?", options: ["고유어(순우리말)", "한자어", "외래어", "외국어"], answer: "한자어" },
      { grade: 5, subject: "국어", question: "원인과 결과를 나타내는 이어주는 말로 알맞은 것은? '비가 많이 내렸다. ( ) 운동장이 물바다가 되었다.'", options: ["그러나", "그래서", "왜냐하면", "하지만"], answer: "그래서" },
      { grade: 5, subject: "국어", question: "이야기의 구성 단계 중 사건이 해결되고 마무리되는 단계는?", options: ["발단", "전개", "절정", "결말"], answer: "결말" },
      { grade: 5, subject: "국어", question: "이야기의 구성 요소인 인물, 사건, 배경 중 '사건이 일어난 시간과 장소'를 뜻하는 것은 무엇입니까?", options: ["인물", "사건", "배경", "주제"], answer: "배경" },
      { grade: 5, subject: "국어", question: "인터넷 블로그나 누리망 게시판에 글을 쓸 때, 다른 사람이 만든 사진이나 글을 올바르게 사용하는 저작권 보호 태도는 무엇입니까?", options: ["원작자의 허락을 받거나 출처를 명확하게 밝히고 사용한다.", "내가 만든 것처럼 원작자의 이름을 지우고 사용한다.", "친한 친구의 작품이라면 허락 없이 마음대로 가져다 쓴다.", "인터넷에 있는 공개 자료는 복사해서 써도 전혀 상관없다."], answer: "원작자의 허락을 받거나 출처를 명확하게 밝히고 사용한다." },
      { grade: 5, subject: "국어", question: "인터넷, 텔레비전, 라디오, 신문 등 사람들에게 다양한 정보와 소식을 전달하는 수단을 통틀어 무엇이라고 합니까?", options: ["우체국", "매체", "전화기", "위성"], answer: "매체" },
      { grade: 5, subject: "국어", question: "자신의 기쁨, 슬픔, 놀라움 등의 느낌을 강하게 나타내며 문장 끝에 느낌표(!)를 주로 사용하는 문장은 무엇입니까?", options: ["평서문", "의문문", "명령문", "감탄문"], answer: "감탄문" },
      { grade: 5, subject: "국어", question: "자신이 겪은 일이나 일기를 쓸 때 가장 중요하게 들어가야 할 내용은?", options: ["남의 생각", "자신의 생각과 느낌", "어려운 한자어", "지어낸 이야기"], answer: "자신의 생각과 느낌" },
      { grade: 5, subject: "국어", question: "전화 통화를 할 때 지켜야 할 올바른 언어 예절로 가장 알맞은 것은 무엇입니까?", options: ["자신이 누구인지 밝히지 않고 용건만 말한다.", "상대방의 상황을 묻지 않고 바로 본론을 이야기한다.", "전화를 걸거나 받을 때 먼저 자신이 누구인지 밝히고 인사한다.", "통화가 끝나면 아무 말 없이 전화를 그냥 끊는다."], answer: "전화를 걸거나 받을 때 먼저 자신이 누구인지 밝히고 인사한다." },
      { grade: 5, subject: "국어", question: "지역에 따라 다르게 사용하는 말로, 그 지역의 독특한 정서와 문화를 담고 있는 말을 무엇이라고 합니까?", options: ["방언(사투리)", "표준어", "외래어", "전문어"], answer: "방언(사투리)" },
      { grade: 5, subject: "국어", question: "'천 리 길도 한 걸음부터'라는 속담의 뜻으로 알맞은 것은?", options: ["먼 곳을 갈 때는 천천히 걸어가야 한다.", "아무리 큰일이라도 처음 시작이 중요하다.", "걸음이 빠른 사람이 먼저 도착한다.", "발이 넓어야 여러 사람을 사귈 수 있다."], answer: "아무리 큰일이라도 처음 시작이 중요하다." },
      { grade: 5, subject: "국어", question: "텔레비전, 인터넷 동영상 등 영상과 소리를 함께 전달하는 매체를 무엇이라고 합니까?", options: ["인쇄 매체", "영상 매체", "음성 매체", "기록 매체"], answer: "영상 매체" },
      { grade: 5, subject: "국어", question: "토론을 할 때 '사회자'의 역할로 가장 알맞은 것은 무엇입니까?", options: ["자신의 주장을 강하게 내세운다.", "상대방의 의견을 무조건 비판한다.", "토론의 규칙을 안내하고 원활하게 진행한다.", "방청객의 의견을 대신 발표해 준다."], answer: "토론의 규칙을 안내하고 원활하게 진행한다." },
      { grade: 5, subject: "국어", question: "토론을 할 때 양측의 주장과 근거를 객관적으로 듣고, 어느 편의 주장이 더 타당하고 규칙을 잘 지켰는지 평가하는 사람들을 무엇이라고 합니까?", options: ["사회자", "토론자", "판정단(심사위원)", "방청객"], answer: "판정단(심사위원)" },
      { grade: 5, subject: "국어", question: "토론을 할 때 참여자가 지켜야 할 올바른 토론의 태도로 알맞지 않은 것은 무엇입니까?", options: ["상대방의 주장에 대해 타당한 근거를 들어 반박한다.", "상대방의 의견이 나와 다르더라도 비꼬거나 화를 내지 않는다.", "자신의 주장이 무조건 맞으므로 상대방의 발언 기회를 차단한다.", "토론 규칙과 정해진 발언 시간을 잘 지킨다."], answer: "자신의 주장이 무조건 맞으므로 상대방의 발언 기회를 차단한다." },
      { grade: 5, subject: "국어", question: "토의를 하는 과정에서 '주제 정하기' 다음에 해야 할 단계는?", options: ["의견 나누기", "의견 모으기", "결정하기", "발표하기"], answer: "의견 나누기" },
      { grade: 5, subject: "국어", question: "토의를 할 때 여러 사람의 의견 중에서 최종 의견을 결정하는 기준으로 가장 올바른 것은 무엇입니까?", options: ["가장 목소리가 큰 사람의 의견을 고른다.", "실현 가능성이 높고 토의 주제에 알맞은 의견을 고른다.", "가장 먼저 제안된 의견을 무조건 고른다.", "내 마음에 드는 의견만 고집한다."], answer: "실현 가능성이 높고 토의 주제에 알맞은 의견을 고른다." },
      { grade: 5, subject: "국어", question: "토의를 할 때 여러 사람의 의견을 모으는 올바른 태도로 알맞지 않은 것은 무엇입니까?", options: ["나와 다른 의견이라도 끝까지 경청한다.", "의견의 장점과 단점을 고루 따져본다.", "다수결의 원칙을 따를 때 소수의 의견은 완전히 무시한다.", "토의 주제에 알맞은 의견인지 확인한다."], answer: "다수결의 원칙을 따를 때 소수의 의견은 완전히 무시한다." },
      { grade: 5, subject: "국어", question: "편지를 쓸 때 받는 사람의 이름 다음 칸에 쓰는, 가장 먼저 건네는 인사말을 무엇이라고 합니까?", options: ["첫인사", "본문", "끝인사", "제명"], answer: "첫인사" },
      { grade: 5, subject: "국어", question: "학교나 지역 사회의 문제점을 지적하고, 이를 해결하기 위해 사람들에게 어떤 행동을 하도록 권유하는 글의 종류는 무엇입니까?", options: ["설명문", "제안하는 글", "전기문", "기행문"], answer: "제안하는 글" },
      { grade: 5, subject: "국어", question: "형태는 같으나 뜻이 여러 개인 '다의어'가 쓰인 문장은?", options: ["사과를 먹었다. / 사과를 했다.", "배를 탔다. / 배가 아프다.", "다리가 아프다. / 책상 다리가 부러졌다.", "눈이 내린다. / 사람의 눈."], answer: "다리가 아프다. / 책상 다리가 부러졌다." },
      { grade: 5, subject: "사회", question: "1897년 고종 황제가 환구단에서 황제 즉위식을 올리며, 대내외에 독립국임을 널리 선포하고 세운 나라의 이름은 무엇입니까?", options: ["조선", "대한제국", "대한민국", "고려"], answer: "대한제국" },
      { grade: 5, subject: "사회", question: "1919년 3월 1일, 일본의 식민 지배에 저항하며 민족 대표 33인과 수많은 시민, 학생이 '대한 독립 만세'를 외친 운동은?", options: ["동학 농민 운동", "3.1 운동", "4.19 혁명", "6.25 전쟁"], answer: "3.1 운동" },
      { grade: 5, subject: "사회", question: "1960년 3월 15일에 일어난 정부의 부정 선거에 항거하여, 전국의 학생들이 중심이 되어 독재 정권을 무너뜨린 대한민국의 대표적인 민주화 운동은 무엇입니까?", options: ["4·19 혁명", "5·18 민주화 운동", "6월 민주 항쟁", "3·1 운동"], answer: "4·19 혁명" },
      { grade: 5, subject: "사회", question: "1970년 서울과 부산을 연결하며 개통된 '경부고속국도'가 우리나라 사회와 경제에 미친 주된 영향으로 가장 알맞은 것은 무엇입니까?", options: ["전국을 '일일 생활권'으로 연결하여 물류와 산업 발달을 크게 앞당겼다.", "도시와 농촌 간의 교류를 완전히 단절시키는 계기가 되었다.", "사람들이 자동차보다 기차를 훨씬 더 많이 타게 만들었다.", "수도권의 밀집된 인구가 농촌으로 대거 이동하는 원인이 되었다."], answer: "전국을 '일일 생활권'으로 연결하여 물류와 산업 발달을 크게 앞당겼다." },
      { grade: 5, subject: "사회", question: "1980년 5월 18일, 광주 시민들이 부당한 권력에 맞서 민주주의를 지키기 위해 일으킨 운동은?", options: ["3.1 운동", "4.19 혁명", "5.18 민주화 운동", "6월 민주 항쟁"], answer: "5.18 민주화 운동" },
      { grade: 5, subject: "사회", question: "가계(가정)가 기업에 노동력을 제공하고 생산 활동에 참여한 대가로 받는 돈을 무엇이라고 합니까?", options: ["이윤", "세금", "소득(임금)", "투자금"], answer: "소득(임금)" },
      { grade: 5, subject: "사회", question: "각 나라가 서로 필요한 물건이나 서비스를 사고파는 경제 활동을 무엇이라고 합니까?", options: ["무역", "소비", "저축", "시장"], answer: "무역" },
      { grade: 5, subject: "사회", question: "겨울철에 짧은 시간 동안 엄청나게 많은 양의 눈이 내려 교통을 마비시키거나 비닐하우스 등 시설물을 파괴하는 자연재해는 무엇입니까?", options: ["황사", "가뭄", "대설", "홍수"], answer: "대설" },
      { grade: 5, subject: "사회", question: "경제 활동 중에서 사람이 노동을 제공하고 그 대가로 회사나 일터에서 받는 돈을 무엇이라고 합니까?", options: ["소득(임금)", "소비", "세금", "기부금"], answer: "소득(임금)" },
      { grade: 5, subject: "사회", question: "경제 활동 중에서 생활에 필요한 물건이나 서비스를 돈을 내고 사는 것을 무엇이라고 합니까?", options: ["생산", "분배", "소비", "저축"], answer: "소비" },
      { grade: 5, subject: "사회", question: "고구려 시대, 수나라의 대군을 살수(청천강)에서 크게 물리쳐 나라를 구한 장군은 누구입니까?", options: ["을지문덕", "강감찬", "이순신", "김유신"], answer: "을지문덕" },
      { grade: 5, subject: "사회", question: "고구려, 백제, 신라의 삼국 중에서 삼국 통일을 이룩한 나라는 어디입니까?", options: ["고구려", "백제", "신라", "가야"], answer: "신라" },
      { grade: 5, subject: "사회", question: "고구려가 멸망한 후, 고구려 유민 대조영이 말갈족과 함께 세운 나라는 어디입니까?", options: ["발해", "신라", "백제", "고려"], answer: "발해" },
      { grade: 5, subject: "사회", question: "고구려를 계승하여 대조영이 세운 '발해'가 영토를 넓히고 전성기를 맞이했을 때, 당나라 사람들이 '바다 동쪽의 번성한 나라'라는 뜻으로 부르던 별칭은 무엇입니까?", options: ["해동성국", "상경성", "동방예의지국", "천조국"], answer: "해동성국" },
      { grade: 5, subject: "사회", question: "고구려의 전성기를 이끌었으며, 한강 유역까지 영토를 넓히고 비석을 세운 왕은 누구입니까?", options: ["광개토대왕", "장수왕", "근초고왕", "진흥왕"], answer: "장수왕" },
      { grade: 5, subject: "사회", question: "고구려의 제19대 왕으로, 영토를 북쪽으로 크게 넓혀 만주벌판을 차지했으며 아들인 장수왕이 그의 업적을 기리기 위해 거대한 비석을 세워준 이 왕은 누구입니까?", options: ["광개토대왕", "동명성왕", "근초고왕", "진흥왕"], answer: "광개토대왕" },
      { grade: 5, subject: "사회", question: "고려 시대 거란의 1차 침입 때, 뛰어난 외교적 담판을 벌여 피 한 방울 흘리지 않고 강동 6주를 되찾은 인물은 누구입니까?", options: ["강감찬", "서희", "윤관", "최무선"], answer: "서희" },
      { grade: 5, subject: "사회", question: "고려 시대 몽골의 침입을 부처님의 힘으로 막아내고자 나무판에 불교 경전을 새겨 만든 문화유산은?", options: ["직지심체요절", "조선왕조실록", "팔만대장경", "훈민정음"], answer: "팔만대장경" },
      { grade: 5, subject: "사회", question: "고려 시대 문익점이 원나라에서 붓통에 숨겨 들어와 우리나라 의복 생활에 큰 변화를 준 식물의 씨앗은?", options: ["벼 씨앗", "보리 씨앗", "목화 씨앗", "유채 씨앗"], answer: "목화 씨앗" },
      { grade: 5, subject: "사회", question: "고려 시대 아라비아 상인들이 드나들며 무역을 했던 대외 무역의 중심 항구이자 국제 무역항의 이름은 무엇입니까?", options: ["울산항", "벽란도", "인천항", "부산포"], answer: "벽란도" },
      { grade: 5, subject: "사회", question: "고려 시대 여진족의 침입을 물리치기 위해 승려와 노비, 군인 등으로 특별 조직한 윤관 장군의 군대 이름은 무엇입니까?", options: ["삼별초", "별무반", "훈련도감", "의병"], answer: "별무반" },

      { grade: 5, subject: "사회", question: "고려 시대, 거란의 3차 침입 때 귀주에서 큰 승리를 거둔 장군은 누구입니까?", options: ["이순신", "강감찬", "을지문덕", "최영"], answer: "강감찬" },

    // 인트로 -> 학년 선택
    function goToGradeSelection() {
        initAudio(); 
        introScreen.style.display = "none";
        gradeScreen.style.display = "block";
    }

    // 학년 선택 -> 과목 선택
    function selectGrade(grade) {
        initAudio();
        selectedGrade = grade;
        gradeScreen.style.display = "none";
        subjectScreen.style.display = "block";
    }

    // 과목 선택 -> 게임 시작
    function startGame(subject) {
        initAudio();
        selectedSubject = subject;
        
        // 선택한 학년과 과목에 맞는 문제만 필터링합니다.
        fullDifficultyDB = quizDB.filter(item => item.grade === selectedGrade && item.subject === selectedSubject);
        
        // 만약 데이터베이스에 해당하는 문제가 없다면 경고창을 띄웁니다.
        if (fullDifficultyDB.length === 0) {
            alert("아직 " + selectedGrade + "학년 " + selectedSubject + " 문제가 준비되지 않았어요! 다른 과목을 골라주세요.");
            return; // 게임을 시작하지 않고 종료
        }

        filteredDB = [...fullDifficultyDB];
        
        subjectScreen.style.display = "none";
        appScreen.style.display = "block";
        
        levelDisplay.innerText = `${selectedGrade}학년 ${selectedSubject} - Level 1`;
        
        generateQuestion();
    }

    // 배열을 무작위로 섞어주는 함수 (보기 배치 섞기용)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // MZ 트렌드 팝업 축하 메시지
    function getLevelUpPopupMessage(level) {
        if (level <= 5) return `[레벨 ${level} 달성]\n오! 폼 미쳤다! 시작부터 찢었어! 천재만재의 등장! 🌟`;
        if (level <= 10) return `[레벨 ${level} 달성]\n와... 두뇌 회전 속도 실화임? 슈퍼컴퓨터도 울고 갈 지능! 🧠🔥`;
        if (level <= 20) return `[레벨 ${level} 달성]\n당신... 혹시 전생에 집현전 학자? 세종대왕님이 박수 치고 계심! 👏👑`;
        if (level <= 30) return `[레벨 ${level} 달성]\n이 정도면 1타 강사! 지나가던 강아지도 당신의 지식에 무릎을 탁 칩니다! 🐶💥`;
        if (level <= 40) return `[레벨 ${level} 달성]\n우주 대폭발급 지식! NASA에서 당신의 뇌를 연구하고 싶어 안달 났어요! 🚀🌌`;
        if (level <= 50) return `[레벨 ${level} 달성]\n지구상에 존재하는 모든 교과서를 흡수한 자! 당신이 걷는 길이 곧 역사가 됩니다! 📚🚶‍♂️`;
        if (level <= 60) return `[레벨 ${level} 달성]\n아인슈타인: '아앗... 내가 졌다.' 역대급 천재성! 당장 노벨상 받으러 가세요! 🏆🥇`;
        if (level <= 90) return `[레벨 ${level} 달성]\n당신이 숨 쉴 때마다 지식의 향기가 퍼져 나갑니다! 걸어 다니는 백과사전 그 자체! 🌸📖`;
        return `[레벨 100 마스터 달성!]\n🎉 경축 🎉 우주 최고, 역사상 전무후무한 초등 지식 마스터 등극! 💰🎉`;
    }

    function getPraiseMessage(level) {
        if (level <= 10) return `교장 선생님도 감격해서 울고 갈 실력! 😭👍`;
        if (level <= 40) return `길 가다 돈 주울 관상입니다! 이 기세로 고고! 💸`;
        return `신의 경지! 오늘 당장 로또 사세요! 🚀💰`;
    }

    const MZRewards = [
        "다이어트 안 해도 1kg 순삭! 폼 미쳤다! 🏃‍♀️💨",
        "내일 아침 꿀피부 예약! 여드름 광클 삭제! ✨",
        "길 가다 이상형이 번호 물어봄! 완전 럭키비키잖아 🍀",
        "통장 잔고 떡상! 벼락부자 가즈아 💸🚀",
        "거울 보면 존잘/존예 보스 등극! 갓벽하다 진짜 👑",
        "오늘 먹은 야식 0칼로리 매직 발동! 🍗💖",
        "이번 주 로또 1등 당첨 기운 뿜뿜! 인생 역전! 🎉",
        "갓생 살기 대성공! 주변에서 칭찬 폭격 쏟아짐! 👏"
    ];

    function generateQuestion() {
        messageDisplay.innerText = "";
        progressDisplay.innerText = `현재 레벨 진행도: ${currentQuestionCount} / ${questionsToAnswer}`;
        
        // 🔥 핵심 수정 사항: 정답을 모두 맞혀 남은 문제가 없다면 리필하지 않고 클리어 알림을 띄웁니다.
        if (filteredDB.length === 0) {
            alert("🎉 대단해요! 준비된 이 과목의 모든 문제를 완벽하게 클리어했습니다! 💯 처음으로 돌아갑니다.");
            location.reload(); // 처음 화면으로 새로고침
            return;
        }

        // 남은 문제 중에서 출제할 문제 하나를 무작위로 선택
        const currentQuiz = filteredDB[Math.floor(Math.random() * filteredDB.length)];
        currentCorrectAnswer = currentQuiz.answer;
        
        // 문제 텍스트 화면에 표시
        questionTextDisplay.innerText = `Q. ${currentQuiz.question}`;

        // 보기를 복사하고 무작위로 섞습니다.
        let options = [...currentQuiz.options];
        options = shuffleArray(options);

        // 보기 버튼 생성
        optionsContainer.innerHTML = "";
        options.forEach(optionText => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optionText;
            btn.onclick = () => checkAnswer(optionText);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption) {
        if (selectedOption === currentCorrectAnswer) {
            playDingDong(); 
            currentQuestionCount++;
            
            // 🔥 맞춘 문제는 목록에서 영구적으로 제외시킵니다. (다시 출제되지 않음)
            filteredDB = filteredDB.filter(item => item.question !== questionTextDisplay.innerText.replace("Q. ", ""));

            messageDisplay.style.color = "#1E90FF";
            messageDisplay.innerText = "정답입니다! 💕";

            setTimeout(() => {
                if (currentQuestionCount >= questionsToAnswer) {
                    if (currentLevel >= maxLevel) {
                        alert(getLevelUpPopupMessage(maxLevel)); 
                        return;
                    }
                    currentLevel++;
                    questionsToAnswer = currentLevel; 
                    currentQuestionCount = 0;
                    
                    levelDisplay.innerText = `${selectedGrade}학년 ${selectedSubject} - Level ${currentLevel}`;
                    
                    alert(getLevelUpPopupMessage(currentLevel));

                    const randomReward = MZRewards[Math.floor(Math.random() * MZRewards.length)];
                    messageDisplay.innerHTML = `${getPraiseMessage(currentLevel)}<br><span style="color:#2C5F2D; font-size:15px; font-weight:bold;">🎁 보너스: ${randomReward}</span>`;
                }
                
                const delay = currentQuestionCount === 0 ? 1500 : 800; 
                setTimeout(() => {
                    generateQuestion(); // 다음 문제 또는 클리어 체크
                }, delay);

            }, 500); 
        } else {
            playBeepBeep(); 
            messageDisplay.style.color = "red";
            messageDisplay.innerText = "앗! 틀렸어요. 처음부터 다시 시작합니다! 😢";
            currentQuestionCount = 0; // 진행도 초기화 (사자성어 챌린지 룰 유지)
            
            // 틀렸을 때는 맞힌 문제들이 다시 섞일 수 있도록 원본 데이터를 다시 불러올지 말지 결정해야 하는데,
            // 챌린지의 묘미를 위해 진행도는 깎이되, 한 번 맞힌 문제는 다시 나오지 않는 현재 방식을 그대로 둡니다.
            
            setTimeout(() => {
                generateQuestion();
            }, 1000);
        }
    }
</script>

</body>
</html>
